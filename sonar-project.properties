sonar.projectKey=ai-usage-extension
sonar.projectName=AI Usage Extension
sonar.projectVersion=0.0.2

sonar.sources=src,manifest.json
sonar.tests=test
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/.idea/**
sonar.coverage.exclusions=manifest.json,src/**/*.html,src/**/*.css
sonar.test.inclusions=test/**/*.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
