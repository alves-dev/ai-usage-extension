<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e4edf8"/>
    </linearGradient>

    <!-- Gauge track fill: red → orange → yellow → green (mesmo que dark) -->
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#dc2626"/>
      <stop offset="20%"  stop-color="#ea6c00"/>
      <stop offset="45%"  stop-color="#d97706"/>
      <stop offset="100%" stop-color="#00c48a"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
    <filter id="shadowSm">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000014"/>
    </filter>
    <filter id="glowLg">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="iconClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Ambient tints -->
  <g clip-path="url(#iconClip)">
    <ellipse cx="256" cy="210" rx="180" ry="140" fill="#00c48a" opacity="0.05" filter="url(#glowLg)"/>
    <ellipse cx="380" cy="250" rx="120" ry="90"  fill="#dc2626" opacity="0.05" filter="url(#glowLg)"/>
  </g>

  <!-- === GAUGE TRACK === -->
  <circle
    cx="256" cy="295" r="130"
    fill="none"
    stroke="#d1dce8"
    stroke-width="38"
    stroke-dasharray="408 409"
    stroke-dashoffset="0"
    stroke-linecap="butt"
    transform="rotate(180 256 295)"
  />

  <!-- Colored arc fill ~78% -->
  <circle
    cx="256" cy="295" r="130"
    fill="none"
    stroke="url(#gaugeGrad)"
    stroke-width="38"
    stroke-dasharray="318 499"
    stroke-dashoffset="0"
    stroke-linecap="butt"
    transform="rotate(180 256 295)"
    filter="url(#shadowSm)"
  />

  <!-- Inner cutout -->
  <circle
    cx="256" cy="295" r="130"
    fill="none"
    stroke="#f0f4ff"
    stroke-width="14"
    stroke-dasharray="416 400"
    stroke-dashoffset="0"
    transform="rotate(180 256 295)"
  />

  <!-- === TICK MARKS === -->
  <g stroke="#f0f4ff" stroke-width="3" stroke-linecap="round">
    <line x1="126" y1="295" x2="114" y2="295"/>
    <line x1="164" y1="203" x2="156" y2="195"/>
    <line x1="256" y1="165" x2="256" y2="153"/>
    <line x1="348" y1="203" x2="356" y2="195"/>
    <line x1="386" y1="295" x2="398" y2="295"/>
  </g>

  <!-- === NEEDLE === -->
  <line x1="256" y1="295" x2="344" y2="220"
    stroke="#1e293b" stroke-width="5" stroke-linecap="round"
    filter="url(#shadowSm)"
  />
  <!-- Needle base -->
  <circle cx="256" cy="295" r="12" fill="#ffffff" stroke="#1e293b" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="256" cy="295" r="5"  fill="#00c48a"/>

  <!-- === CENTER READOUT === -->
  <text x="256" y="278"
    font-family="'SF Mono', 'Fira Mono', monospace"
    font-size="30" font-weight="700"
    fill="#1e293b" text-anchor="middle"
  >78%</text>

  <!-- === SCALE LABELS === -->
  <text x="112" y="318" font-family="'SF Mono', monospace" font-size="20" fill="#dc2626" opacity="0.8" text-anchor="middle">0%</text>
  <text x="400" y="318" font-family="'SF Mono', monospace" font-size="20" fill="#00a876" opacity="0.8" text-anchor="middle">100%</text>

  <!-- === SEPARATOR === -->
  <line x1="80" y1="338" x2="432" y2="338" stroke="#c8d6e5" stroke-width="1.5" opacity="0.8"/>

  <!-- === BOTTOM TEXT === -->
  <text
    x="256" y="430"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="62" font-weight="900"
    text-anchor="middle" letter-spacing="1"
  >
    <tspan fill="#00a876">IA</tspan><tspan fill="#1e293b"> USAGE</tspan>
  </text>

  <!-- Bottom accent dots -->
  <circle cx="222" cy="452" r="3.5" fill="#00c48a" opacity="0.7"/>
  <circle cx="236" cy="452" r="3.5" fill="#d97706" opacity="0.6"/>
  <circle cx="250" cy="452" r="3.5" fill="#dc2626" opacity="0.5"/>
</svg>
